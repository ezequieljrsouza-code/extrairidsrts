<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extrair IDs RTS</title>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:30px;
}

.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

h2{
    margin-top:0;
}

textarea{
    width:100%;
    height:250px;
    resize:vertical;
    padding:12px;
    font-size:15px;
    margin-top:10px;
}

.botoes{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:20px 0;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    color:#fff;
    font-size:15px;
    transition:.2s;
}

button:hover{
    opacity:.9;
}

.btn-extrair{
    background:#007bff;
}

.btn-copiar{
    background:#28a745;
}

.btn-limpar{
    background:#dc3545;
}

#resultado{
    height:300px;
}

/* Toast */

.toast{
    position:fixed;
    top:20px;
    right:20px;
    min-width:250px;
    padding:15px 20px;
    color:#fff;
    border-radius:8px;
    font-weight:bold;
    opacity:0;
    transform:translateY(-20px);
    transition:.3s;
    z-index:9999;
    pointer-events:none;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

.toast.success{
    background:#28a745;
}

.toast.error{
    background:#dc3545;
}
</style>

</head>
<body>

<div class="container">

<h2>Extrair IDs RTS</h2>

<p>Colar:</p>

<textarea id="entrada" placeholder="Cole aqui..."></textarea>

<div class="botoes">
    <button class="btn-extrair" onclick="extrair()">Extrair IDs</button>
    <button class="btn-copiar" onclick="copiar()">Copiar Lista</button>
    <button class="btn-limpar" onclick="limpar()">Limpar</button>
</div>

<h3>Resultado</h3>

<textarea id="resultado" readonly placeholder="Os IDs aparecerão aqui..."></textarea>

</div>

<div id="toast" class="toast"></div>

<script>

function mostrarToast(mensagem,tipo="success"){

    const toast=document.getElementById("toast");

    toast.textContent=mensagem;
    toast.className="toast "+tipo+" show";

    clearTimeout(toast.timer);

    toast.timer=setTimeout(()=>{
        toast.classList.remove("show");
    },2000);

}

function extrair(){

    const texto=document.getElementById("entrada").value;

    const ids=texto.match(/\b\d{11}\b/g)||[];

    const unicos=[...new Set(ids)];

    // Adiciona ">" antes de cada ID
    const lista=unicos.map(id => "> " + id);

    document.getElementById("resultado").value=lista.join("\n");

    if(unicos.length===0){
        mostrarToast("Nenhum ID encontrado.","error");
    }else{
        mostrarToast(unicos.length+" IDs encontrados.");
    }

}

function copiar(){

    const resultado=document.getElementById("resultado");

    if(resultado.value.trim()==""){
        mostrarToast("Não há IDs para copiar.","error");
        return;
    }

    navigator.clipboard.writeText(resultado.value)

    .then(()=>{
        mostrarToast("Lista copiada com sucesso!");
    })

    .catch(()=>{

        resultado.select();
        document.execCommand("copy");

        mostrarToast("Lista copiada!");

    });

}

function limpar(){

    document.getElementById("entrada").value="";
    document.getElementById("resultado").value="";

    document.getElementById("entrada").focus();

    mostrarToast("Campos limpos.");

}

</script>

</body>
</html>
